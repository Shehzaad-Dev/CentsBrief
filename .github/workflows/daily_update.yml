name: Daily Finance Brief Update

on:
  schedule:
    # 05:00 UTC daily
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      catch_up_days:
        description: "Backfill missing briefs for the last N days (max 5)"
        required: false
        default: "3"
      patch_mgid:
        description: "Patch MGID head script onto index and recent briefs"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-brief-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Groq API key
        env:
          GROQ_API_KEY_SECRET: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_LEGACY: ${{ secrets.GroqAPI }}
        run: |
          if [ -n "$GROQ_API_KEY_SECRET" ]; then
            echo "GROQ_API_KEY=$GROQ_API_KEY_SECRET" >> "$GITHUB_ENV"
            echo "Groq secret: GROQ_API_KEY is set."
          elif [ -n "$GROQ_API_KEY_LEGACY" ]; then
            echo "GROQ_API_KEY=$GROQ_API_KEY_LEGACY" >> "$GITHUB_ENV"
            echo "Groq secret: using legacy name GroqAPI (rename to GROQ_API_KEY when you can)."
          else
            echo "::error::Missing Groq API key. In GitHub open Settings → Secrets and variables → Actions → New repository secret → Name: GROQ_API_KEY → paste your key from https://console.groq.com/keys"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify RSS feed
        run: |
          python - <<'PY'
          from main import fetch_top_finance_news, resolve_feed_url
          titles = fetch_top_finance_news(resolve_feed_url(), limit=3)
          print("RSS OK:", titles)
          PY

      - name: Patch MGID markup on site pages
        if: github.event_name == 'workflow_dispatch' && inputs.patch_mgid == true
        run: python main.py --patch-mgid --sync-homepage-only

      - name: Generate daily brief (with catch-up)
        env:
          GROQ_MODEL: llama-3.3-70b-versatile
          GROQ_FALLBACK_MODEL: llama-3.1-8b-instant
          SITE_BASE_URL: https://centsbreif.online
          BRIEF_RETENTION_DAYS: "60"
          MIN_BRIEF_WORDS: "800"
        run: |
          CATCH_UP="${{ github.event_name == 'workflow_dispatch' && inputs.catch_up_days || '3' }}"
          python main.py --catch-up-days "$CATCH_UP" --patch-mgid

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html briefs sitemap.xml robots.txt article-template.html mgid.config.json mgid_integrate.py main.py assets/
            git ls-files --deleted | grep -E '^briefs/' | xargs -r git rm -f
            git ls-files | grep '^brief-' | xargs -r git rm -f
            git commit -m "chore: publish daily automated finance brief and MGID/SEO updates"
            git push
          else
            echo "No changes detected."
          fi
